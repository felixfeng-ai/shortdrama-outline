name: Deploy Production

# 与 interview-coach 的 .github/workflows/deploy.yml 同一套模式：
# push 到 main → SSH 到香港服务器 → 执行服务器上的 cicd-deploy.sh
#
# 首次使用需要在 GitHub 仓库里配两个 Secret：
#   Settings → Secrets and variables → Actions → New repository secret
#   CHENGJU_HOST     = 43.129.23.197
#   CHENGJU_SSH_KEY  = 本地 ~/.ssh/deploy_key 的私钥全文
#                     （与 interview-coach 用的是同一把 key，可直接复用）

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 部署到生产服务器
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH 执行服务器部署脚本
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CHENGJU_HOST }}
          username: ubuntu
          key: ${{ secrets.CHENGJU_SSH_KEY }}
          script: |
            set -e
            bash /opt/chengju/cicd-deploy.sh
