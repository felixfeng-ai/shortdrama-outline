name: Deploy Production

# 与 interview-coach 的 .github/workflows/deploy.yml 同一套模式：
# push 到 main → SSH 到香港服务器 → 执行服务器上的 cicd-deploy.sh
#
# 首次使用需要在 GitHub 仓库里配置：
#   Settings → Secrets and variables → Actions → New repository secret
#   CHENGJU_HOST     = 服务器公网 IP
#   CHENGJU_SSH_KEY  = 部署用私钥全文
#   MINIMAX_API_KEY  = MiniMax 视频服务密钥
#   UNLIMITED_QUOTA_ACCOUNTS = 管理账号白名单，逗号或分号分隔

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: 测试、构建与安全审计
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build

  deploy:
    name: 部署到生产服务器
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: SSH 执行服务器部署脚本
        uses: appleboy/ssh-action@v1.2.0
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
          WEB_PUSH_PUBLIC_KEY: ${{ secrets.WEB_PUSH_PUBLIC_KEY }}
          WEB_PUSH_PRIVATE_KEY: ${{ secrets.WEB_PUSH_PRIVATE_KEY }}
          WEB_PUSH_SUBJECT: ${{ secrets.WEB_PUSH_SUBJECT }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          VIDEO_GENERATION_ENABLED: "1"
          MINIMAX_VIDEO_MODEL: "MiniMax-H3-Lite"
          MINIMAX_VIDEO_RESOLUTION: "768P"
          AUTH_ALLOW_DEV_CODE: "0"
          UNLIMITED_QUOTA_ACCOUNTS: "felix@chenju.work"
          CHENGJU_DAILY_UNITS: "300"
          API_IMAGE_IP_10M_LIMIT: "120"
          API_IMAGE_IDENTITY_10M_LIMIT: "60"
          API_IMAGE_GLOBAL_DAILY_LIMIT: "2000"
          IMAGE_QUEUE_CONCURRENCY: "2"
          IMAGE_MODEL_CONCURRENCY_JSON: "{}"
          IMAGE_AVERAGE_SECONDS: "45"
        with:
          host: ${{ secrets.CHENGJU_HOST }}
          username: ubuntu
          key: ${{ secrets.CHENGJU_SSH_KEY }}
          envs: RESEND_API_KEY,AUTH_EMAIL_FROM,WEB_PUSH_PUBLIC_KEY,WEB_PUSH_PRIVATE_KEY,WEB_PUSH_SUBJECT,MINIMAX_API_KEY,VIDEO_GENERATION_ENABLED,MINIMAX_VIDEO_MODEL,MINIMAX_VIDEO_RESOLUTION,AUTH_ALLOW_DEV_CODE,UNLIMITED_QUOTA_ACCOUNTS,CHENGJU_DAILY_UNITS,API_IMAGE_IP_10M_LIMIT,API_IMAGE_IDENTITY_10M_LIMIT,API_IMAGE_GLOBAL_DAILY_LIMIT,IMAGE_QUEUE_CONCURRENCY,IMAGE_MODEL_CONCURRENCY_JSON,IMAGE_AVERAGE_SECONDS
          script: |
            set -e
            # 先同步主分支，确保执行的是本次提交里的部署脚本。
            cd /opt/chengju
            git fetch origin main --quiet
            git reset --hard origin/main --quiet
            bash /opt/chengju/deploy/cicd-deploy.sh
