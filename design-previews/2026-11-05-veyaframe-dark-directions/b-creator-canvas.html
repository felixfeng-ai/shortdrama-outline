<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>方案 B · Creator Canvas</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./base.css">
  <style>
    :root {
      --bg: #0b0b0d;
      --side: #0e0e10;
      --sheet: #121214;
      --tool: #19191c;
      --tool-active: #182a2f;
      --ink: #f0f0ec;
      --muted: #adaeaa;
      --faint: #777a7d;
      --accent: #8fd1df;
      --accent-ink: #071316;
      --line: rgba(255, 255, 255, .09);
      --ease: cubic-bezier(.23, 1, .32, 1);
    }

    body {
      background: var(--bg);
    }

    .canvas-home {
      display: grid;
      min-height: 100dvh;
      grid-template-columns: 238px minmax(0, 1fr);
      grid-template-rows: 64px minmax(0, 1fr);
    }

    .canvas-top {
      position: sticky;
      z-index: 20;
      top: 0;
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 0 26px;
      background: #0c0c0e;
    }

    .canvas-brand {
      display: flex;
      min-width: 190px;
      align-items: center;
      gap: 10px;
    }

    .canvas-brand svg {
      width: 31px;
      height: 31px;
      stroke-width: 1.4;
      color: var(--ink);
    }

    .canvas-brand b {
      font-size: 17px;
      font-weight: 680;
    }

    .canvas-brand small {
      color: var(--faint);
      font-size: 11px;
      letter-spacing: .12em;
    }

    .canvas-nav {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .canvas-nav a {
      min-height: 34px;
      padding: 0 11px;
      border-radius: 6px;
      color: #999c9b;
      font-size: 12px;
      line-height: 34px;
    }

    .canvas-nav a.is-active {
      background: #171719;
      color: var(--ink);
    }

    .canvas-top-right {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-left: auto;
      color: #8e9293;
      font-size: 11px;
    }

    .quota-pill {
      display: inline-flex;
      min-height: 30px;
      align-items: center;
      gap: 6px;
      padding: 0 9px;
      border-radius: 6px;
      background: #171719;
    }

    .quota-pill svg {
      width: 14px;
      height: 14px;
    }

    .user-dot {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-ink);
      font-size: 11px;
      font-weight: 700;
    }

    .canvas-side {
      position: sticky;
      top: 64px;
      display: flex;
      height: calc(100dvh - 64px);
      flex-direction: column;
      padding: 18px 16px;
      background: var(--side);
    }

    .side-group {
      display: grid;
      gap: 3px;
      padding: 10px 0 20px;
    }

    .side-label {
      padding: 0 11px 7px;
      color: #8b9093;
      font-size: 11px;
    }

    .side-link {
      display: flex;
      min-height: 43px;
      align-items: center;
      gap: 11px;
      padding: 0 11px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #989b9b;
      font-size: 12.5px;
      text-align: left;
      cursor: pointer;
    }

    .side-link svg {
      width: 18px;
      height: 18px;
      stroke-width: 1.5;
      color: #74797b;
    }

    .side-link.is-active {
      background: #171719;
      color: var(--ink);
    }

    .side-link.is-active svg {
      color: var(--ink);
    }

    .side-link em {
      margin-left: auto;
      padding: 1px 5px;
      border-radius: 999px;
      background: #1c2a2e;
      color: #79b7c5;
      font-size: 11px;
      font-style: normal;
    }

    .side-feature {
      margin-top: auto;
      display: grid;
      gap: 9px;
      padding: 12px;
      border-radius: 9px;
      background: #151518;
    }

    .side-feature img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 6px;
      filter: saturate(.8) brightness(.82);
    }

    .side-feature b {
      color: #dedfdb;
      font-size: 11px;
      font-weight: 550;
    }

    .side-feature p {
      margin: 0;
      color: #959a9a;
      font-size: 12px;
      line-height: 1.55;
    }

    .canvas-main {
      min-width: 0;
      padding: 26px 28px 56px;
    }

    .canvas-intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 17px;
    }

    .canvas-intro > div {
      display: grid;
      gap: 3px;
    }

    .canvas-intro h1 {
      margin: 0;
      color: var(--ink);
      font-size: 24px;
      font-weight: 620;
      line-height: 1.25;
    }

    .canvas-intro p {
      margin: 0;
      color: #929798;
      font-size: 12px;
    }

    .canvas-intro button {
      min-height: 34px;
      padding: 0 13px;
      border: 0;
      border-radius: 6px;
      background: #f2f2ee;
      color: #111;
      font-size: 11.5px;
      font-weight: 650;
      cursor: pointer;
    }

    .create-canvas {
      position: relative;
      display: grid;
      min-height: 228px;
      place-items: center;
      overflow: hidden;
      border-radius: 11px;
      background:
        radial-gradient(circle at center, rgba(143, 209, 223, .055), transparent 38%),
        #151517;
      cursor: pointer;
    }

    .create-canvas::before {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, .11) .8px, transparent .8px);
      background-size: 17px 17px;
      opacity: .55;
      content: "";
    }

    .create-action {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 11px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    .create-action i {
      display: grid;
      width: 68px;
      height: 52px;
      place-items: center;
      border-radius: 14px;
      background: #f4f4f0;
      color: #111;
      transition: transform 150ms var(--ease);
    }

    .create-action:hover i {
      transform: translateY(-2px);
    }

    .create-action svg {
      width: 25px;
      height: 25px;
      stroke-width: 1.4;
    }

    .create-action b {
      font-size: 14px;
      font-weight: 600;
    }

    .create-hint {
      position: absolute;
      right: 16px;
      bottom: 13px;
      color: #989e9f;
      font-size: 12px;
    }

    .tools-section {
      margin-top: 25px;
    }

    .section-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .section-line h2 {
      margin: 0;
      color: #dbddda;
      font-size: 16px;
      font-weight: 580;
    }

    .section-line a,
    .section-line button {
      border: 0;
      background: transparent;
      color: #7c8082;
      font-size: 11.5px;
      cursor: pointer;
    }

    .tool-strip {
      display: grid;
      grid-template-columns: repeat(8, minmax(76px, 1fr));
      gap: 9px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: thin;
    }

    .tool {
      display: grid;
      min-width: 76px;
      gap: 7px;
      border: 0;
      background: transparent;
      color: #a8aba9;
      text-align: center;
      cursor: pointer;
    }

    .tool i {
      display: grid;
      width: 100%;
      aspect-ratio: 1.1;
      place-items: center;
      border-radius: 11px;
      background: #19191c;
      color: #b3b5b2;
      transition: background-color 150ms var(--ease), color 150ms var(--ease);
    }

    .tool svg {
      width: 25px;
      height: 25px;
      stroke-width: 1.35;
    }

    .tool b {
      overflow: hidden;
      font-size: 11.5px;
      font-weight: 450;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tool.is-active i {
      background: var(--tool-active);
      color: var(--accent);
    }

    .tool.is-active b {
      color: #d5e9ed;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .project-card {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      align-items: center;
      gap: 11px;
      min-width: 0;
      padding: 9px;
      border-radius: 9px;
      background: #131315;
      cursor: pointer;
      transition: background-color 150ms var(--ease), transform 150ms var(--ease);
    }

    .project-card:hover {
      background: #18181b;
      transform: translateY(-1px);
    }

    .project-card img {
      width: 74px;
      height: 62px;
      object-fit: cover;
      border-radius: 6px;
      filter: saturate(.82) brightness(.82);
    }

    .project-card div {
      display: grid;
      min-width: 0;
      gap: 3px;
    }

    .project-card b {
      overflow: hidden;
      color: #d7d8d5;
      font-size: 11.5px;
      font-weight: 540;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .project-card span {
      color: #929798;
      font-size: 11px;
    }

    .latest-grid {
      display: grid;
      grid-template-columns: 1.15fr .85fr .85fr 1.15fr;
      gap: 10px;
    }

    .latest-card {
      position: relative;
      min-height: 170px;
      overflow: hidden;
      border-radius: 9px;
      background: #151517;
    }

    .latest-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: saturate(.78) brightness(.72);
      transition: transform 300ms var(--ease), filter 300ms var(--ease);
    }

    .latest-card:hover img {
      filter: saturate(.91) brightness(.84);
      transform: scale(1.02);
    }

    .latest-card figcaption {
      position: absolute;
      right: 10px;
      bottom: 9px;
      left: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #e5e5e1;
      font-size: 11.5px;
      text-shadow: 0 1px 4px rgba(0, 0, 0, .8);
    }

    .latest-card figcaption span {
      color: #c4c6c3;
      font-size: 11px;
    }

    .canvas-help {
      position: fixed;
      z-index: 30;
      right: 22px;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .canvas-help .person {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 18%;
      filter: saturate(.75) brightness(.9);
    }

    .help-button {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: #18181b;
      color: #d2d4d1;
      cursor: pointer;
    }

    .help-button svg {
      width: 17px;
      height: 17px;
    }

    @media (hover: hover) and (pointer: fine) {
      .side-link:hover,
      .canvas-nav a:hover {
        background: #171719;
        color: #e5e6e3;
      }
      .tool:hover i {
        background: #202024;
        color: #e4e5e2;
      }
    }

    @media (max-width: 1100px) {
      .canvas-home {
        grid-template-columns: 76px minmax(0, 1fr);
      }
      .canvas-side {
        align-items: center;
        padding: 16px 9px;
      }
      .side-group {
        width: 100%;
      }
      .side-label,
      .side-link span,
      .side-link em,
      .side-feature {
        display: none;
      }
      .side-link {
        justify-content: center;
        padding: 0;
      }
      .side-link svg {
        width: 19px;
        height: 19px;
      }
      .canvas-brand {
        min-width: auto;
      }
      .projects-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 760px) {
      .canvas-home {
        display: block;
      }
      .canvas-top {
        min-height: 58px;
        padding: 0 15px;
      }
      .canvas-brand small,
      .canvas-nav,
      .quota-pill {
        display: none;
      }
      .canvas-top-right {
        gap: 8px;
      }
      .canvas-side {
        display: none;
      }
      .canvas-main {
        padding: 20px 16px 74px;
      }
      .canvas-intro {
        display: grid;
        align-items: start;
      }
      .canvas-intro button {
        min-height: 44px;
      }
      .create-canvas {
        min-height: 220px;
      }
      .tool-strip {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        overflow: visible;
      }
      .projects-grid {
        grid-template-columns: minmax(0, 1fr);
      }
      .latest-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .latest-card {
        min-height: 138px;
      }
      .latest-card figcaption {
        display: grid;
        gap: 2px;
        font-size: 11.5px;
        line-height: 1.35;
      }
      .latest-card figcaption span {
        display: none;
      }
      .canvas-help {
        right: 14px;
        bottom: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="canvas-home">
    <header class="canvas-top">
      <a class="canvas-brand" href="#" aria-label="VeyaFrame 首页">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 9 16 3l11 6v14l-11 6L5 23z"/><path d="m10 11 6 10 6-10"/></svg>
        <b>VeyaFrame</b>
        <small>CREATE</small>
      </a>
      <nav class="canvas-nav" aria-label="主导航">
        <a class="is-active" href="#">首页</a>
        <a href="#">项目</a>
        <a href="#">资产</a>
        <a href="#">创作技能</a>
      </nav>
      <div class="canvas-top-right">
        <span class="quota-pill">
          <svg viewBox="0 0 20 20"><path d="m11 2-6 9h4l-1 7 7-10h-4l0-6Z"/></svg>
          65
        </span>
        <span>帮助</span>
        <span class="user-dot">冯</span>
      </div>
    </header>

    <aside class="canvas-side">
      <div class="side-group">
        <span class="side-label">工作区</span>
        <button class="side-link is-active" type="button"><svg viewBox="0 0 24 24"><path d="m4 11 8-7 8 7v9H4z"/><path d="M9 20v-6h6v6"/></svg><span>首页</span></button>
        <button class="side-link" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg><span>项目</span></button>
        <button class="side-link" type="button"><svg viewBox="0 0 24 24"><path d="M4 8h16v11H4z"/><path d="M8 8V5h8v3M4 12h16"/></svg><span>资产</span></button>
      </div>
      <div class="side-group">
        <span class="side-label">创作</span>
        <button class="side-link" type="button"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 6h8M7 8l4 8M17 8l-4 8"/></svg><span>Veya Canvas</span></button>
        <button class="side-link" type="button"><svg viewBox="0 0 24 24"><path d="M12 3 14 9l6 2-6 2-2 6-2-6-6-2 6-2z"/></svg><span>Veya Agent</span><em>BETA</em></button>
        <button class="side-link" type="button"><svg viewBox="0 0 24 24"><path d="m12 3 8 5-8 5-8-5z"/><path d="m4 13 8 5 8-5"/></svg><span>3D 场景 Box</span></button>
      </div>
      <div class="side-group">
        <span class="side-label">学习与社区</span>
        <button class="side-link" type="button"><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 13h6"/></svg><span>创作教程</span></button>
        <button class="side-link" type="button"><svg viewBox="0 0 24 24"><path d="M5 6h14v12H5z"/><path d="m9 10 3 3 3-3"/></svg><span>作品精选</span></button>
      </div>
      <div class="side-feature">
        <img src="../../public/docs/tutorial/04-timeline.png" alt="时间线教程封面">
        <b>从分镜到成片</b>
        <p>用项目时间线试一遍完整制作链路。</p>
      </div>
    </aside>

    <main class="canvas-main">
      <header class="canvas-intro">
        <div>
          <h1>开始一部新短剧</h1>
          <p>从一句话、剧本或已有素材开始，画布会记录每个制作节点。</p>
        </div>
        <button type="button">导入已有项目</button>
      </header>

      <section class="create-canvas" aria-label="新建画布">
        <button class="create-action" id="createCanvas" type="button">
          <i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>
          <b>新建画布创作</b>
        </button>
        <span class="create-hint">故事 · 角色 · 分镜 · 视频都在同一张画布上</span>
      </section>

      <section class="tools-section" aria-labelledby="toolsTitle">
        <header class="section-line">
          <h2 id="toolsTitle">创作工具</h2>
          <a href="#">管理模型</a>
        </header>
        <div class="tool-strip">
          <button class="tool is-active" type="button"><i><svg viewBox="0 0 24 24"><path d="m12 3 2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/></svg></i><b>故事生成</b></button>
          <button class="tool" type="button"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 19c1-3.4 3.3-5 7-5s6 1.6 7 5"/></svg></i><b>角色设计</b></button>
          <button class="tool" type="button"><i><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m7 16 4-5 3 3 3-4"/></svg></i><b>图片生成</b></button>
          <button class="tool" type="button"><i><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="m9 8 7 4-7 4z"/></svg></i><b>视频生成</b></button>
          <button class="tool" type="button"><i><svg viewBox="0 0 24 24"><path d="M6 18V8M12 18V4M18 18v-6"/></svg></i><b>声音生成</b></button>
          <button class="tool" type="button"><i><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/><circle cx="12" cy="12" r="8"/></svg></i><b>分镜拆解</b></button>
          <button class="tool" type="button"><i><svg viewBox="0 0 24 24"><path d="M4 17h16M7 14V7h10v7"/><path d="m9 10 3 3 3-3"/></svg></i><b>镜头编排</b></button>
          <button class="tool" type="button"><i><svg viewBox="0 0 24 24"><path d="M5 5h14v14H5z"/><path d="M8 15h8M8 11h5"/></svg></i><b>成片输出</b></button>
        </div>
      </section>

      <section class="tools-section" aria-labelledby="projectsTitle">
        <header class="section-line">
          <h2 id="projectsTitle">最近项目</h2>
          <a href="#">查看全部</a>
        </header>
        <div class="projects-grid">
          <article class="project-card">
            <img src="../../public/skills/manor.png" alt="">
            <div><b>快递员的最后一单</b><span>刚刚 · 第 6 步</span></div>
          </article>
          <article class="project-card">
            <img src="../../public/skills/story.png" alt="">
            <div><b>雨夜替身</b><span>昨天 · 第 2 步</span></div>
          </article>
          <article class="project-card">
            <img src="../../public/docs/tutorial/02-visual-assets.png" alt="">
            <div><b>长街旧梦</b><span>10 月 28 日 · 第 4 步</span></div>
          </article>
          <article class="project-card">
            <img src="../../public/docs/tutorial/05-export.png" alt="">
            <div><b>成为嫌疑人</b><span>10 月 26 日 · 已交付</span></div>
          </article>
        </div>
      </section>

      <section class="tools-section" aria-labelledby="latestTitle">
        <header class="section-line">
          <h2 id="latestTitle">最近上新</h2>
          <a href="#">作品广场</a>
        </header>
        <div class="latest-grid">
          <figure class="latest-card"><img src="../../public/docs/tutorial/03-shot-video.png" alt="镜头视频工作台界面"><figcaption>镜头视频工作台 <span>创作工具</span></figcaption></figure>
          <figure class="latest-card"><img src="../../public/docs/tutorial/04-timeline.png" alt="时间线成片界面"><figcaption>时间线成片 <span>工作流</span></figcaption></figure>
          <figure class="latest-card"><img src="../../public/skills/continuity.png" alt="现场连续性检查插图"><figcaption>连续性检查 <span>Skill</span></figcaption></figure>
          <figure class="latest-card"><img src="../../public/skills/manor.png" alt="场景视觉锚点示例"><figcaption>场景锚点 <span>视觉参考</span></figcaption></figure>
        </div>
      </section>
    </main>
  </div>

  <div class="canvas-help">
    <img class="person" src="../../public/skills/story.png" alt="">
    <button class="help-button" id="helpButton" type="button" aria-label="联系 Veya Agent">
      <svg viewBox="0 0 24 24"><path d="M5 6h14v10H9l-4 3z"/><path d="M9 10h6"/></svg>
    </button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const toast = document.getElementById('toast');
    let timer;
    function notify(message) {
      toast.textContent = message;
      toast.classList.add('is-visible');
      clearTimeout(timer);
      timer = setTimeout(() => toast.classList.remove('is-visible'), 2200);
    }
    document.getElementById('createCanvas').addEventListener('click', () => notify('交互 Demo：正式版会创建一张项目画布。'));
    document.getElementById('helpButton').addEventListener('click', () => notify('交互 Demo：正式版会从这里唤出 Veya Agent。'));
    document.querySelectorAll('.tool').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.tool').forEach((item) => item.classList.remove('is-active'));
        button.classList.add('is-active');
      });
    });
  </script>
</body>
</html>
