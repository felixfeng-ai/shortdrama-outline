<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>成剧原生视觉验收</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #070b0d;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      iframe {
        width: 390px;
        height: 844px;
        border: 0;
        background: #101417;
      }
    </style>
  </head>
  <body>
    <iframe src="/" title="成剧原生 App 视觉"></iframe>
    <script>
      const params = new URLSearchParams(location.search);
      const route = params.get('route');
      const width = Number(params.get('w'));
      if (route) document.querySelector('iframe').src = route;
      if (Number.isFinite(width) && width >= 320) {
        document.querySelector('iframe').style.width = `${width}px`;
      }
    </script>
  </body>
</html>
