# VeyaTV 生产站点：veyatv.com 为 canonical，chenju.work 保留会话交接
#
# 首次启用：
#   1. 将 veyatv.com / www.veyatv.com 的 A 记录指向本机公网 IP
#   2. 执行 sudo bash deploy/bootstrap-veyatv-domain.sh
#
# 应用运行在 127.0.0.1:3001。模型流和成片任务需要长连接，因此读写超时统一 660s。

server {
    listen 443 ssl http2;
    server_name veyatv.com;

    ssl_certificate     /etc/letsencrypt/live/veyatv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veyatv.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:veyatv_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 4m;
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location = /api/project-import {
        client_max_body_size 260m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_request_buffering off;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        add_header Cache-Control "no-store";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}

server {
    listen 443 ssl http2;
    server_name www.veyatv.com;

    ssl_certificate     /etc/letsencrypt/live/veyatv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/veyatv.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://veyatv.com$request_uri;
}

# 旧域必须继续代理到应用，由 Proxy 完成 Cookie 加密交接后再跳转到新域。
server {
    listen 443 ssl http2;
    server_name chenju.work www.chenju.work;

    ssl_certificate     /etc/letsencrypt/live/chenju.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chenju.work/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:chenju_legacy_ssl:10m;
    ssl_session_timeout 1d;

    client_max_body_size 4m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        add_header Cache-Control "no-store";
    }
}

server {
    listen 80;
    server_name veyatv.com www.veyatv.com chenju.work www.chenju.work;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
