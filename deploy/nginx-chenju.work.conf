# 成剧 chenju.work —— 与 interview-coach 同机（腾讯云香港，免备案）
#
# 与 mianshi.pro 的差异，都是踩过或可预见到的坑：
#
#   1) 上游是 3001 而不是 3000。3000 已被 interview-coach 的 `i面试` 进程占用，
#      照抄会 EADDRINUSE 起不来。
#
#   2) proxy_read_timeout 必须大于应用的模型超时。lib/deepseek.ts 里 TIMEOUT_MS = 120s，
#      nginx 默认只有 60s —— 第三步生成 10 集时上游还没返回，nginx 就先 504 了，
#      表现为「本地跑得好好的，一上线第三步就挂」。这里给到 300s。
#
#   3) gzip_proxied any。系统 nginx.conf 的 gzip_types / gzip_proxied 默认是注释掉的，
#      不加这几行，反代响应一律不压缩（与 veyawork.work 同一处坑）。
#
# 首次部署前置条件：
#   - DNS：chenju.work 与 www.chenju.work 的 A 记录 → 本机公网 IP
#   - 证书：sudo certbot --nginx -d chenju.work -d www.chenju.work
#     （certbot 会自己往本文件写 ssl 指令；本文件先带上也不冲突）

server {
    listen 443 ssl http2;
    server_name chenju.work www.chenju.work;

    ssl_certificate     /etc/letsencrypt/live/chenju.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chenju.work/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:chenju_work_ssl:10m;
    ssl_session_timeout 1d;

    # 这个产品只提交一句话想法和编辑后的文本，2m 绰绰有余
    client_max_body_size 2m;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # 带 hash 的构建产物，可以放心长缓存
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # 见文件头第 2 条：必须 > 应用的 120s 模型超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 页面本身不缓存，避免改了前端还拿到旧页面
        add_header Cache-Control "no-store";
    }
}

server {
    listen 80;
    server_name chenju.work www.chenju.work;
    # Let's Encrypt 续期挑战
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
